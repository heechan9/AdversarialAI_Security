name: Square Attack extension
on:
  pull_request:
    paths:
      - 'src/adversarial_ai/attacks/square.py'
      - 'src/adversarial_ai/evaluation/square_evaluation.py'
      - 'tests/test_square.py'
      - 'verification/square_saved_audit.py'
      - 'verification/square_defense_comparison.py'
      - 'results/extensions/square/**'
      - '.github/workflows/square.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  square:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pytest
      - run: python -m pytest tests/test_square.py -q
        env:
          PYTHONPATH: src
      - run: python verification/square_saved_audit.py
      - name: Recalculate paired full-test comparison
        run: |
          python verification/square_defense_comparison.py results/extensions/square/cnn_none_full_20261003 results/extensions/square/cnn_gaussian_full_20261003 > /tmp/square-comparison.json
          diff -u results/extensions/square/comparison_full_20261003.json /tmp/square-comparison.json
