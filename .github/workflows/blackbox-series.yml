name: Trained CNN black-box evidence
on:
  pull_request:
    paths:
      - 'src/adversarial_ai/attacks/surfree_adapter.py'
      - 'src/adversarial_ai/evaluation/surfree_evaluation.py'
      - 'src/adversarial_ai/evaluation/square_evaluation.py'
      - 'verification/*blackbox*'
      - 'verification/subset_sensitivity.py'
      - 'results/extensions/sensitivity/20261002/subsets.json'
      - 'verification/surfree_saved_audit.py'
      - 'tests/test_surfree_adapter.py'
      - 'tests/test_surfree_evidence.py'
      - 'results/extensions/surfree/**'
      - 'results/extensions/blackbox/**'
      - 'results/extensions/square/*q*20261003/**'
      - '.github/workflows/blackbox-series.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pytest
      - run: python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_square.py tests/test_surfree_adapter.py tests/test_surfree_evidence.py -q
        env:
          PYTHONPATH: src
      - run: python verification/square_saved_audit.py
      - run: python verification/surfree_saved_audit.py
      - run: |
          python verification/blackbox_series_summary.py > /tmp/blackbox-summary.json
          diff -u results/extensions/blackbox/summary_20261003.json /tmp/blackbox-summary.json
      - run: |
          python verification/blackbox_subset_sensitivity.py > /tmp/blackbox-subsets.json
          diff -u results/extensions/blackbox/subset_sensitivity_20261004.json /tmp/blackbox-subsets.json
