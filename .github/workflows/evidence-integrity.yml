name: Evidence integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install pytest
      - name: Recompute independent Stage A evidence
        run: python verification/stage_a_clean_recompute.py
      - name: Validate Stage B locked contract
        run: python verification/stage_b_readiness.py --contract-only
      - name: Test Stage B fail-closed gate
        run: python -m pytest tests/test_stage_b_readiness.py -q

  maris-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/maris
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify MARIS evidence and defense exports
        run: pnpm run test:evidence
