name: Evidence integrity

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify paired defense descriptive research
        run: |
          python -m unittest discover -s research/paired_defense_review -v
          python -O -m unittest discover -s research/paired_defense_review -v
      - name: Recompute independent Stage A evidence
        run: python verification/stage_a_clean_recompute.py
      - name: Validate Stage B locked contract
        run: python verification/stage_b_readiness.py --contract-only
      - name: Test Stage B fail-closed gate
        run: python -m pytest tests/test_stage_b_readiness.py tests/test_stage_b_run.py tests/test_stage_b_bundle.py tests/test_stage_b_differences.py tests/test_stage_b_trace_selection.py tests/test_stage_b_original_environment.py -q
      - name: Check scoped verification status and generated displays
        run: |
          python verification/status_registry.py
          python -m pytest tests/test_verification_status.py tests/test_issue_lifecycle.py -q
      - name: Compare MARIS with canonical research results
        run: python verification/maris_source_check.py

  maris-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/maris
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare the preserved panel/export to the pinned #95 merge commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify MARIS evidence and defense exports
        run: pnpm run test:evidence
      - name: Verify bilingual UI, mission states and synthetic controls
        run: pnpm run test:ui
      # The real project identity belongs only to the Sites source repository.
      # This binding-free fixture is for CI compilation and is never deployed.
      - name: Prepare nondeployable hosting config for CI
        run: |
          mkdir -p .openai
          printf '%s\n' '{"d1":null,"r2":null}' > .openai/hosting.json
      - name: Typecheck and lint MARIS
        run: |
          pnpm exec tsc --noEmit
          pnpm run lint
      - name: Build MARIS production bundle
        run: pnpm run build
