name: Follow-up iterative attacks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  iterative-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tensorflow-cpu==2.21.0 pytest
      - run: python -m pytest tests/test_iterative.py -q
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: '3'
