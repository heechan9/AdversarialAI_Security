name: Follow-up iterative attacks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  iterative-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tensorflow-cpu==2.21.0 pytest pillow
      - run: python -m pytest tests/test_iterative.py tests/test_jsma_training.py tests/test_iterative_result_audit.py tests/test_followup_snapshot.py tests/test_local_split_audit.py -q
        env:
          PYTHONPATH: src
          TF_CPP_MIN_LOG_LEVEL: '3'
      - name: Recalculate preserved partial checkpoints
        run: |
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261001/bim
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261001/pgd
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261002-0004/bim
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261002-0004/pgd
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261002-mobile/bim
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261002-mobile/pgd
          python verification/iterative_result_audit.py results/extensions/checkpoints/20261002-mobile-r2/bim
