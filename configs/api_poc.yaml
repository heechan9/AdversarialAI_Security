# Multimodal API PoC configuration — NO real API calls yet.
# Provider status: see docs/API_SELECTION.md (currently "Conditional recommendation").

provider:
  selected: null              # not finalized — do not hardcode a provider yet
  candidates: [openai, anthropic, google]
  env_var_by_provider:
    openai: OPENAI_API_KEY
    anthropic: ANTHROPIC_API_KEY
    google: GOOGLE_API_KEY

output_schema:
  type: object
  properties:
    predicted_class:
      type: string
      enum:
        - "Aircraft Carrier"
        - "Bulkers"
        - "Car Carrier"
        - "Container Ship"
        - "Cruise"
        - "DDG"
        - "Recreational"
        - "Sailboat"
        - "Submarine"
        - "Tug"
    reason:
      type: string
    uncertain:
      type: boolean
    attack_suspected:
      type: boolean
  required: [predicted_class, reason, uncertain, attack_suspected]
  additionalProperties: false

poc_plan:
  phase_1_clean_only:
    images: 20
    class_balance: true
  phase_2_repeat_consistency:
    images: 50
    repeats: 3
  phase_3_clean_adversarial_pairs:
    pairs: 100
  phase_4_full (blocked until phase 1-3 pass and team approves cost):
    images: 781
    attack_variants: [clean, fgsm, bim, pgd, jsma]

evaluation_fields:
  - correct
  - prediction_changed_after_attack
  - out_of_enum_class
  - json_parse_success
  - repeat_call_consistency
  - uncertain_flag_used
  - attack_suspected_flag_used

note: >
  This is a Transfer Attack evaluation: adversarial images are generated by
  CNN/MobileNet (white-box) and then submitted as input to the multimodal
  API. No FGSM/BIM/PGD/JSMA is run against the multimodal API's own weights —
  it has no exposed gradient to attack.
