# Experiment configuration — values marked "proposed" are not yet confirmed
# against actual code. See docs/EXPERIMENT_CONTRACT.md for definitions.

dataset:
  num_classes: 10
  classes_file: configs/classes.json
  test_set_size: 781          # confirmed (existing classification_report.txt)
  train_val_split: "unconfirmed"  # TODO: confirm from actual training code
  seed: "not_applicable_clean_eval"  # shuffle=False; training seed remains unconfirmed

environment:
  python: "3.11.15"
  tensorflow: "2.21.0"
  keras: "3.15.1"
  conda_environment: "adversarial_ai"
  reproduced_on: "2026-08-05"

models:
  cnn_baseline:
    file: models/cnn_baseline.h5   # not tracked in git — see REPRODUCIBILITY.md
    input_shape: [128, 128, 3]
    normalization: "rescale=1./255"   # per handoff_spec.json
    existing_test_accuracy: 0.6453264951705933
    reproduced_test_loss: 4.026247978210449
  mobilenet:
    stage1_file: models/mobilenet_stage1.h5
    finetuned_file: models/mobilenet_finetuned.h5
    input_shape: [224, 224, 3]
    normalization: "rescale=1./255"  # evaluation pipeline; training-code confirmation pending
    existing_test_accuracy: 0.7848911881446838
    reproduced_test_loss: 1.1212257146835327

attacks:
  input_range: [0, 1]   # fixed evaluation/attack threat-model range for both models
  fgsm:
    epsilon_candidates: [0.0, 0.01, 0.03, 0.05]  # proposed; mentor confirmation pending
    steps: 1
    targeted: false
    loss: categorical_crossentropy
    clip_range: [0, 1]
  bim:
    epsilon: "proposed"
    alpha: "proposed"
    steps: "proposed"
  pgd:
    epsilon: "proposed"
    alpha: "proposed"
    steps: "proposed"
    random_start: true
  jsma:
    scope: "targeted white-box, L0"
    max_perturbed_pixel_ratio: "proposed"

metrics:
  - clean_accuracy
  - robust_accuracy
  - accuracy_drop
  - macro_precision
  - macro_recall
  - macro_f1
  - untargeted_asr   # denominator = clean-correct samples (confirmed for FGSM)
  - targeted_asr
